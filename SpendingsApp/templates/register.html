{% extends 'base.html' %}

{% block navbar %}{% endblock %}

{% block content %}

<div id="register-container" class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-5">

      <div class="card shadow">
          <div class="card-header text-right text-secondary bg-primary text-light">
              <h1 class="card-title">Create your account</h1>
              <h4 class="card-subtitle">to maximize your savings</h4>
          </div>
          <div class="card-body">
              <form id="register-form" class="form">
                  <br>
                  {% csrf_token %}
                  <div class="form-group">
                    <span class="input-group-text mb-3 mx-4 text-secondary bg-dark border-0">
                        <i class="bi bi-envelope me-3"></i>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                    </span>
                    <span class="input-group-text mb-3 mx-4 text-secondary bg-dark border-0">
                        <i class="bi bi-person me-3"></i>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                    </span>
                      <span class="input-group-text mb-3 mx-4 text-secondary bg-dark border-0">
                        <i class="bi bi-lock me-3"></i>
                        <input type="password" class="form-control" id="password1" name="password1" placeholder="Password" required>
                      </span>
                      <span class="input-group-text mb-3 mx-4 text-secondary bg-dark border-0">
                        <i class="bi bi-lock me-3"></i>
                        <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm Password" required>
                      </span>
                      <br>
                      <div class="row mb-3 mx-4">
                          <button type="submit" class="btn btn-primary text-light w-100"><b>Register</b></button>
                      </div>
                      <div class="row mb-3 mx-4">
                          <p class="text-light text-center w-100">Already have an account? <a href="{% url 'login' %}" class="link-secondary text-decoration-none">Log in</a></p>
                      </div>
                  </div>
              </form>
          </div>
        </div>

    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}

{% load static %}
<script type="module" src="{% static 'js/auth/register.js' %}"></script

{% endblock %}
