{% extends 'base.html' %}

{% block navbar %}{% endblock %}

{% block content %}
<div id="login-container" class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-5">

      <div class="card shadow border border-secondary">
          <div class="card-header border border-secondary text-center text-secondary">
              <h1 class="card-title">Login</h1>
              <h4 class="card-subtitle">to save and buy <i class="bi bi-currency-bitcoin"></i>itcoin</h4>
          </div>
          <div class="card-body">
              <form id="login-form" class="form" method="post" action="{% url 'login' %}">
                  {% csrf_token %}
                  <div class="form-group">
                      <span class="input-group-text mb-3 mx-4 text-secondary">
                        <i class="bi bi-person me-3"></i>
                        {{ form.username }}
                      </span>
                      <span class="input-group-text mb-3 mx-4 text-secondary">
                        <i class="bi bi-lock me-3"></i>
                        {{ form.password }}
                      </span>
                      <div class="row mb-3 mx-4">
                          <button type="submit" class="btn btn-secondary w-100"><b>login</b></button>
                      </div>
                  </div>
              </form>
          </div>
        </div>

    </div>
  </div>
</div>
{% endblock %}
