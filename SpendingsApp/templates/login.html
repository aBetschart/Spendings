{% extends 'base.html' %}

{% block navbar %}{% endblock %}

{% block content %}
<div id="login-container" class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-5">

      <div class="card shadow">
          <div class="card-header text-right text-secondary bg-primary text-light">
              <h1 class="card-title">Log in to your ledger</h1>
              <h4 class="card-subtitle">to start saving and collect <i class="bi bi-currency-bitcoin"></i>itcoin</h4>
          </div>
          <div class="card-body">
              <form id="login-form" class="form" method="post" action="{% url 'login' %}">
                  <br>
                  {% csrf_token %}
                  <div class="form-group">
                      <span class="input-group-text mb-3 mx-4 text-secondary bg-dark border-0">
                        <i class="bi bi-person me-3"></i>
                        {{ form.username }}
                      </span>
                      <span class="input-group-text mb-3 mx-4 text-secondary bg-dark border-0">
                        <i class="bi bi-lock me-3"></i>
                        {{ form.password }}
                      </span>
                      <br>
                      <div class="row mb-3 mx-4">
                          <button type="submit" class="btn btn-primary text-light w-100"><b>login</b></button>
                      </div>
                      <div class="row mb-3 mx-4">
                          <p class="text-light text-center w-100">New here? <a href="#" class="text-secondary text-decoration-none">Create an account</a></p>
                      </div>
                  </div>
              </form>
          </div>
        </div>

    </div>
  </div>
</div>
{% endblock %}
